[general]
working_directory = "C:/Users/Alex"

# mkdir -p C:/Users/Alex/.config/alacritty/themes
# git clone https://github.com/alacritty/alacritty-theme C:/Users/Alex/.config/alacritty/themes
import = [
    # "~/.config/alacritty/themes/themes/ayu_dark.toml",
    # "~/.config/alacritty/themes/themes/catppuccin_frappe.toml",
    "~/.config/alacritty/themes/themes/catppuccin_mocha.toml",
    # "~/.config/alacritty/themes/themes/kanagawa_wave.toml",
    # "~/.config/alacritty/themes/themes/monokai_pro.toml",
    # "~/.config/alacritty/themes/themes/moonlight_ii_vscode.toml",
    # "~/.config/alacritty/themes/themes/oceanic_next.toml",
    # "~/.config/alacritty/themes/themes/sonokai.toml",
    # "~/.config/alacritty/themes/themes/tokyo_night_storm.toml",
]

[terminal]
shell = { program = "powershell", args = ["-NoLogo"] }

[window]
title = "Terminal"
dynamic_title = false
startup_mode = "Windowed"
decorations = "None"
opacity = 1.0
padding = { x = 16, y = 16 }
position = { x = 600, y = 400 }
dimensions = { columns = 120, lines = 25 }

[font]
normal = { family = "Iosevka Term", style = "Regular" }
bold = { family = "Iosevka Term", style = "bold" }
italic = { family = "Iosevka Term", style = "italic" }
bold_italic = { family = "Iosevka Term", style = "bold italic" }
size = 14

[cursor]
style = { shape = "Block", blinking = "Never" }

[mouse]
bindings = [{ mouse = "Right", action = "Paste" }]

[keyboard]
bindings = [
    { key = "F11", action = "ToggleFullscreen" },
    { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },

    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "F", mods = "Control", action = "SearchForward" },
    { key = "N", mods = "Control", action = "CreateNewWindow" },
]

[selection]
save_to_clipboard = true
