---
- name: Deploy "homarr"
  hosts: all
  become: no

  vars:
    homarr_image: ghcr.io/homarr-labs/homarr:latest
    homarr_address: 0.0.0.0
    homarr_port: 7575
    homarr_dir: /opt/homarr
    homarr_data_dir: /opt/homarr/data

  tasks:
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ homarr_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure data directory exists
      ansible.builtin.file:
        path: "{{ homarr_data_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"

    - name: Generate secret encryption key
      ansible.builtin.shell: openssl rand -hex 32
      register: secret_key
      changed_when: false

    - name: Write the compose.yml
      ansible.builtin.copy:
        dest: "{{ homarr_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            homarr:
              image: "{{ homarr_image }}"
              container_name: homarr
              restart: unless-stopped
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - {{ homarr_data_dir }}:/appdata
              environment:
                - SECRET_ENCRYPTION_KEY={{ secret_key.stdout }}
              ports:
                - "{{ homarr_address }}:{{ homarr_port }}:7575"

    - name: Deploy the service
      community.docker.docker_compose_v2:
        project_src: "{{ homarr_dir }}"
        files:
          - compose.yml
        state: present
        pull: always
