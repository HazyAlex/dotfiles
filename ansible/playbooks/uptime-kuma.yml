---
- name: Deploy "uptime-kuma"
  hosts: all
  become: true

  vars:
    uptime_kuma_image: louislam/uptime-kuma:1
    uptime_kuma_address: 0.0.0.0
    uptime_kuma_port: 3001
    uptime_kuma_dir: /opt/uptime-kuma
    uptime_kuma_volume: uptime-kuma

  tasks:
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ uptime_kuma_dir }}"
        state: directory
        mode: "0755"

    - name: Write the compose.yml
      ansible.builtin.copy:
        dest: "{{ uptime_kuma_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            uptime-kuma:
              image: "{{ uptime_kuma_image }}"
              container_name: uptime-kuma
              ports:
                - "{{ uptime_kuma_address }}:{{ uptime_kuma_port }}:3001"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock:ro
                - {{ uptime_kuma_volume }}:/app/data
              restart: unless-stopped
          volumes:
            {{ uptime_kuma_volume }}:

    - name: Deploy the service
      community.docker.docker_compose_v2:
        project_src: "{{ uptime_kuma_dir }}"
        files:
          - compose.yml
        state: present
        pull: always
