---
- name: Deploy "jellyfin"
  hosts: all
  become: no

  vars:
    current_user: "{{ ansible_facts['user_id'] }}"
    jellyfin_image: jellyfin/jellyfin:latest
    jellyfin_port: 8096
    jellyfin_dir: /opt/jellyfin
    jellyfin_data_dir: /opt/jellyfin/data
    jellyfin_cache_volume: jellyfin-cache

  vars_prompt:
    - name: base_media_path
      prompt: "Enter the base media path"
      default: /srv/media
      private: no

  tasks:
    - name: Derive media subpaths from base path
      ansible.builtin.set_fact:
        jellyfin_movies_path: "{{ base_media_path }}/movies"
        jellyfin_tv_path: "{{ base_media_path }}/tv"
        jellyfin_music_path: "{{ base_media_path }}/music"
        jellyfin_books_path: "{{ base_media_path }}/books"

    - name: Ensure base media path exists
      become: yes
      ansible.builtin.file:
        path: "{{ base_media_path }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Ensure project directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ jellyfin_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Ensure config directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ jellyfin_data_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Write the compose.yml
      ansible.builtin.copy:
        dest: "{{ jellyfin_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            jellyfin:
              image: "{{ jellyfin_image }}"
              container_name: jellyfin
              ports:
                - "{{ jellyfin_port }}:8096/tcp"
                - "7359:7359/udp"
              environment:
                TZ: "{{ ansible_date_time.tz }}"
              volumes:
                - {{ jellyfin_cache_volume }}:/cache
                - {{ jellyfin_data_dir }}:/config
                - {{ jellyfin_movies_path }}:/media/movies:ro
                - {{ jellyfin_tv_path }}:/media/tv:ro
                - {{ jellyfin_music_path }}:/media/music:ro
                - {{ jellyfin_books_path }}:/media/books:ro
              restart: unless-stopped
          volumes:
            {{ jellyfin_cache_volume }}:

    - name: Deploy the service
      community.docker.docker_compose_v2:
        project_src: "{{ jellyfin_dir }}"
        files:
          - compose.yml
        state: present
        pull: always
