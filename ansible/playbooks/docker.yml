---
- name: Install and Configure Docker
  hosts: all
  become: yes
  tasks:
    - name: Install Docker
      pacman:
        name:
          - docker
          - docker-compose
        state: present

    - name: Start and enable the service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add the user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
