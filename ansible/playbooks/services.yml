---
- name: Bootstrap the services
  hosts: all
  become: no

  vars:
    current_user: "{{ ansible_user_id }}"
    internal_bind_address: ""

  tasks:
    - name: Determine internal IP address
      set_fact:
        detected_bind_address: "{{ ansible_default_ipv4.address }}"

    - name: Ask for confirmation of auto-detected internal IP
      pause:
        prompt: "Auto-detected internal IP: {{ detected_bind_address }}. Is this correct? [y/N]"
      register: internal_bind_confirm

    - name: Use detected internal IP when confirmed
      set_fact:
        internal_bind_address: "{{ detected_bind_address }}"
      when:
        - internal_bind_confirm.user_input | lower in ['y', 'yes']

    - name: Ask user to input internal IP when detected IP is not accepted
      pause:
        prompt: "Please enter the server's IP address on the internal network:"
      register: manual_bind_address
      when:
        - internal_bind_confirm.user_input | lower not in ['y', 'yes']

    - name: Use manually provided internal IP
      set_fact:
        internal_bind_address: "{{ manual_bind_address.user_input }}"
      when:
        - internal_bind_confirm.user_input | lower not in ['y', 'yes']

    - name: Ensure that the services directory exists
      become: yes
      ansible.builtin.file:
        path: "/opt"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Ensure group_vars directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../group_vars"
        state: directory
        mode: "0755"

    - name: Write internal_bind_address to group_vars file
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../group_vars/all.yml"
        content: |
          # ------------------------------
          #  This file is auto-generated.
          # ------------------------------
          internal_bind_address: "{{ internal_bind_address }}"
        mode: "0644"
