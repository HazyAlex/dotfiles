---
- name: Bootstrap the services
  hosts: all
  become: no

  vars:
    current_user: "{{ ansible_facts['user_id'] }}"

  tasks:
    - name: Ensure that the services directory exists
      become: yes
      ansible.builtin.file:
        path: "/opt"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"
