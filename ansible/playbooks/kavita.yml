---
- name: Deploy "kavita"
  hosts: all
  become: no

  vars:
    current_user: "{{ ansible_user_id }}"
    kavita_image: jvmilazz0/kavita:latest
    kavita_port: 5000
    kavita_dir: /opt/kavita
    kavita_data_dir: /opt/kavita/data

  vars_prompt:
    - name: base_media_path
      prompt: "Enter the base media path"
      default: /srv/media
      private: no

  tasks:
    - name: Ensure base media path exists
      become: yes
      ansible.builtin.file:
        path: "{{ base_media_path }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Derive media subpaths from base path
      ansible.builtin.set_fact:
        kavita_manga_path: "{{ base_media_path }}/manga"
        kavita_comics_path: "{{ base_media_path }}/comics"
        kavita_books_path: "{{ base_media_path }}/books"

    - name: Ensure project directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ kavita_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Ensure config directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ kavita_data_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Write the compose.yml
      ansible.builtin.copy:
        dest: "{{ kavita_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            kavita:
              image: "{{ kavita_image }}"
              container_name: kavita
              ports:
                - "{{ kavita_port }}:5000"
              environment:
                TZ: "{{ ansible_date_time.tz }}"
              volumes:
                - {{ kavita_data_dir }}:/kavita/config
                - {{ kavita_manga_path }}:/manga
                - {{ kavita_comics_path }}:/comics
                - {{ kavita_books_path }}:/books
              restart: unless-stopped

    - name: Deploy the service
      community.docker.docker_compose_v2:
        project_src: "{{ kavita_dir }}"
        files:
          - compose.yml
        state: present
        pull: always
