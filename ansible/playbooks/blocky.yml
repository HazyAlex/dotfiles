---
- name: Deploy "blocky"
  hosts: all
  become: no

  vars:
    current_user: "{{ ansible_user_id }}"
    blocky_image: spx01/blocky:latest
    blocky_port: 53
    blocky_dir: /opt/blocky
    blocky_data_dir: /opt/blocky/data

  tasks:
    - name: Ensure project directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ blocky_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Ensure data directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ blocky_data_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Write the blocky config.yml
      ansible.builtin.copy:
        dest: "{{ blocky_data_dir }}/config.yml"
        mode: "0644"
        content: |
          upstreams:
            groups:
              default:
                - 1.1.1.1
                - 8.8.8.8

          blocking:
            denylists:
              ads:
                - https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt
                - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
              adult:
                - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts

            clientGroupsBlock:
              default:
                - ads
                - adult

          ports:
            dns: "{{ blocky_port }}"

    - name: Write the compose.yml
      ansible.builtin.copy:
        dest: "{{ blocky_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            blocky:
              image: "{{ blocky_image }}"
              container_name: blocky
              restart: unless-stopped
              ports:
                - "{{ blocky_port }}:53/tcp"
                - "{{ blocky_port }}:53/udp"
                - "{{ blocky_port }}:53/tcp"
                - "{{ blocky_port }}:53/udp"
              environment:
                - TZ={{ ansible_date_time.tz }}
              volumes:
                - {{ blocky_data_dir }}/config.yml:/app/config.yml:ro
                - /etc/localtime:/etc/localtime:ro

    - name: Deploy the service
      community.docker.docker_compose_v2:
        project_src: "{{ blocky_dir }}"
        files:
          - compose.yml
        state: present
        pull: always

