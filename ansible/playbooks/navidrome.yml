---
- name: Deploy "navidrome"
  hosts: all
  become: no

  vars:
    current_user: "{{ ansible_facts['user_id'] }}"
    navidrome_image: deluan/navidrome:latest
    navidrome_port: 4533
    navidrome_dir: /opt/navidrome
    navidrome_data_dir: /opt/navidrome/data

  vars_prompt:
    - name: base_media_path
      prompt: "Enter the base media path"
      default: /srv/media
      private: no

  tasks:
    - name: Get user UID
      ansible.builtin.getent:
        database: passwd
        key: "{{ current_user }}"
      register: user_info

    - name: Set user UID and GID
      ansible.builtin.set_fact:
        uid: "{{ user_info.ansible_facts.getent_passwd[current_user][1] }}"
        gid: "{{ user_info.ansible_facts.getent_passwd[current_user][2] }}"

    - name: Ensure base media path exists
      become: yes
      ansible.builtin.file:
        path: "{{ base_media_path }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Derive music path from base path
      ansible.builtin.set_fact:
        navidrome_music_path: "{{ base_media_path }}/music"

    - name: Ensure project directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ navidrome_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Ensure data directory exists
      become: yes
      ansible.builtin.file:
        path: "{{ navidrome_data_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Write the compose.yml
      ansible.builtin.copy:
        dest: "{{ navidrome_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            navidrome:
              image: "{{ navidrome_image }}"
              container_name: navidrome
              user: "{{ uid }}:{{ gid }}"
              ports:
                - "{{ navidrome_port }}:4533"
              environment:
                TZ: "{{ ansible_date_time.tz }}"
                ND_ENABLEINSIGHTSCOLLECTOR: false
              volumes:
                - {{ navidrome_data_dir }}:/data
                - {{ navidrome_music_path }}:/music:ro
              restart: unless-stopped

    - name: Deploy the service
      community.docker.docker_compose_v2:
        project_src: "{{ navidrome_dir }}"
        files:
          - compose.yml
        state: present
        pull: always
