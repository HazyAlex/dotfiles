---
- name: Base Server Configuration
  hosts: all
  become: no

  vars_files:
    - ../vars/base_packages.yml

  vars:
    current_user: "{{ ansible_user_id }}"

  vars_prompt:
    - name: ssh_public_key
      prompt: "Enter your SSH public key (press Enter to skip)"
      private: no
      default: ""

  tasks:
    - name: Update system
      become: yes
      pacman:
        update_cache: yes
        upgrade: yes

    - name: archlinux-keyring - enable weekly update
      become: yes
      systemd:
        name: archlinux-keyring-wkd-sync.timer
        enabled: yes
        state: started

    - name: Install essential packages
      become: yes
      pacman:
        name: "{{ base_packages }}"
        state: present

    - name: makepkg - enable parallel compilation"
      become: yes
      lineinfile:
        path: /etc/makepkg.conf
        regexp: '#MAKEFLAGS="-j2"'
        line: 'MAKEFLAGS="-j$(nproc)"'

    - name: enable weekly SSD disks trim
      become: yes
      systemd:
        name: fstrim.timer
        enabled: yes
        state: started

    - name: Configure SSH hardening
      become: yes
      lineinfile:
        path: /etc/ssh/sshd_config
        line: "{{ item.key }} {{ item.value }}"
        regexp: "^{{ item.key }}"
        state: present
      loop:
        - { key: "PermitRootLogin", value: "no" }
        - { key: "PasswordAuthentication", value: "no" }
        - { key: "PubkeyAuthentication", value: "yes" }
        - { key: "MaxAuthTries", value: "3" }
        - { key: "ClientAliveInterval", value: "600" }
        - { key: "ClientAliveCountMax", value: "2" }
        - { key: "X11Forwarding", value: "no" }
        - { key: "AllowTcpForwarding", value: "no" }
        - { key: "Compression", value: "no" }
        - { key: "UseDNS", value: "no" }

    - name: Create .ssh directory for ansible user
      file:
        path: "/home/{{ current_user }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ current_user }}"
        group: "{{ current_user }}"

    - name: Add SSH public key to authorized_keys
      authorized_key:
        user: "{{ current_user }}"
        key: "{{ ssh_public_key }}"
        state: present
      when: ssh_public_key != ""

    - name: Enable and (re)start the SSH service
      become: yes
      systemd:
        name: sshd
        state: restarted
        enabled: yes

    - name: Configure fail2ban
      become: yes
      copy:
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 3

          [sshd]
          enabled = true
          port = ssh
          logpath = /var/log/auth.log
          maxretry = 3
        dest: /etc/fail2ban/jail.local
        mode: '0644'

    - name: Start and enable fail2ban
      become: yes
      systemd:
        name: fail2ban
        state: started
        enabled: yes

    - name: Enable and start systemd-timesyncd
      become: yes
      systemd:
        name: systemd-timesyncd
        enabled: yes
        state: started
